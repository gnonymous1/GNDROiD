syntax = "proto3";

package indusbridge.emulator.cellular;

enum CellularMode {
  MODE_A_PHYSICAL_WWAN = 0;
  MODE_B_REMOTE_SIM_APDU = 1;
  MODE_C_SDR_5G_STACK = 2;
  MODE_D_SYNTHETIC_MOCK = 3;
}

message ApduCommandRequest {
  uint32 slot_id = 1;
  bytes apdu_bytes = 2;       // ISO/IEC 7816-4 APDU (CLA, INS, P1, P2, Lc, Data, Le)
  uint32 timeout_ms = 3;
}

message ApduResponseReply {
  bytes response_data = 1;     // APDU payload + Status Words (SW1, SW2 e.g. 0x90 0x00)
  uint32 sw1 = 2;
  uint32 sw2 = 3;
  bool success = 4;
  string error_message = 5;
}

message SmsNotification {
  string sender_address = 1;
  string message_body = 2;
  string smsc_address = 3;
  int64 timestamp_epoch_ms = 4;
}

message CellularStatus {
  CellularMode active_mode = 1;
  string carrier_name = 2;
  string mcc = 3;
  string mnc = 4;
  string imsi = 5;
  string iccid = 6;
  string ip_address = 7;
  int32 signal_strength_dbm = 8;
  bool is_registered = 9;
}

message CellularStatusQuery {}

message SwitchModeRequest {
  CellularMode target_mode = 1;
}

service CellularBridgeService {
  rpc TransmitApdu(ApduCommandRequest) returns (ApduResponseReply);
  rpc InjectSms(SmsNotification) returns (ApduResponseReply);
  rpc GetStatus(CellularStatusQuery) returns (CellularStatus);
  rpc SwitchMode(SwitchModeRequest) returns (CellularStatus);
}
