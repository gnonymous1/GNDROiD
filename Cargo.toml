[workspace]
members = [
    "hypervisor",
    "cellular",
    "ai-control-plane",
    "gndroid-cli",
]
resolver = "2"

[workspace.dependencies]
tokio = { version = "1.39", features = ["full"] }
tonic = "0.12"
prost = "0.13"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1.0"
thiserror = "1.0"
clap = { version = "4.5", features = ["derive"] }
colored = "2.1"
